<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>RK Labs</title>
    <meta name="description" content="RK Labs, LLC makes the iPhone apps Step Scroll, Sales Wizard and Morning Proof.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50' y='68' font-size='52' fill='white' text-anchor='middle' font-family='monospace' font-weight='300'>RK</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
        }

        body {
            background: #000;
            overflow: hidden;
            cursor: crosshair;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .stage {
            position: fixed;
            inset: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(2.75rem, 7vh, 4.5rem);
            pointer-events: none;
        }
        .title {
            position: relative;
            padding-left: 0.35em; /* balances the trailing letter-spacing so the word sits centred */
            color: #fff;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 300;
            font-size: clamp(2rem, 6vw, 5rem);
            letter-spacing: 0.35em;
            text-transform: uppercase;
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
            animation: glow 4s ease-in-out infinite alternate;
            will-change: text-shadow;
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 30px rgba(255, 255, 255, 0.08),
                    0 0 60px rgba(255, 255, 255, 0.04);
            }
            to {
                text-shadow:
                    0 0 40px rgba(255, 255, 255, 0.15),
                    0 0 80px rgba(255, 255, 255, 0.06),
                    0 0 120px rgba(255, 255, 255, 0.02);
            }
        }

        .grain {
            position: fixed;
            inset: -100%;
            width: 300%;
            height: 300%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.03;
            filter: url(#noiseFilter);
        }

        .credit {
            position: fixed;
            bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: rgba(255, 255, 255, 0.45);
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 300;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .credit:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .apps {
            display: flex;
            justify-content: center;
            gap: clamp(1.75rem, 6vw, 3.25rem);
            list-style: none;
            pointer-events: auto;
            animation: arrive 1.2s 0.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }
        @keyframes arrive {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }
        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            text-decoration: none;
            outline: none;
        }
        .app img {
            display: block;
            width: clamp(64px, 17vw, 84px);
            height: clamp(64px, 17vw, 84px);
            border-radius: 22.5%;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 12px 32px rgba(0, 0, 0, 0.6);
            filter: brightness(0.92);
            transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1), filter 0.35s ease, box-shadow 0.35s ease;
        }
        .app span {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 300;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.55);
            white-space: nowrap;
            transition: color 0.35s ease;
        }
        .app:hover img,
        .app:focus-visible img {
            transform: translateY(-3px);
            filter: brightness(1);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22), 0 16px 40px rgba(0, 0, 0, 0.7);
        }
        .app:hover span,
        .app:focus-visible span {
            color: #fff;
        }
        .app:focus-visible img {
            box-shadow: 0 0 0 2px #fff, 0 16px 40px rgba(0, 0, 0, 0.7);
        }
        @media (prefers-reduced-motion: reduce) {
            .apps { animation: none; }
            .app img { transition: none; }
            .title { animation: none; }
        }
        .credit {
            display: flex;
            gap: 2.5rem;
            text-transform: none;
            letter-spacing: 0.06em;
        }
        .credit .contact {
            color: inherit;
            text-decoration: none;
            outline: none;
        }
        .credit .contact:focus-visible {
            color: #fff;
            text-decoration: underline;
        }
        .credit .contact:hover {
            color: rgba(255, 255, 255, 0.85);
        }
    </style>
</head>
<body>
    <svg style="display:none">
        <filter id="noiseFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </svg>

    <canvas id="particles"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>
    <main class="stage">
        <h1 class="title">RK Labs</h1>
        <ul class="apps">
            <li><a class="app" href="https://apps.apple.com/us/app/step-scroll-earn-screen-time/id6791864617"><img src="icons/step-scroll.png" alt="" width="84" height="84"><span>Step Scroll</span></a></li>
            <li><a class="app" href="https://apps.apple.com/us/app/sales-wizard/id6758815392"><img src="icons/sales-wizard.png" alt="" width="84" height="84"><span>Sales Wizard</span></a></li>
            <li><a class="app" href="https://apps.apple.com/us/app/morning-proof/id6757691737"><img src="icons/morning-proof.png" alt="" width="84" height="84"><span>Morning Proof</span></a></li>
        </ul>
    </main>
    <footer class="credit"><span>&copy; 2026 RK Labs, LLC</span><a class="contact" href="mailto:rkrane@rkrane.com">rkrane@rkrane.com</a></footer>


    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        const title = document.querySelector('.title');

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null };
        let animId;

        const CONNECTION_DIST = 150;
        const CONNECTION_DIST_SQ = CONNECTION_DIST * CONNECTION_DIST;
        const MOUSE_RADIUS = 200;
        const MOUSE_RADIUS_SQ = MOUSE_RADIUS * MOUSE_RADIUS;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }

        function createParticle() {
            return {
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                r: Math.random() * 1.2 + 0.4,
                o: Math.random() * 0.4 + 0.2
            };
        }

        function init() {
            resize();
            const count = width < 600 ? 50 : width < 1024 ? 80 : 110;
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(createParticle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            const len = particles.length;

            // Update positions
            for (let i = 0; i < len; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < -10) p.x = width + 10;
                else if (p.x > width + 10) p.x = -10;
                if (p.y < -10) p.y = height + 10;
                else if (p.y > height + 10) p.y = -10;
            }

            // Draw connections between particles
            ctx.lineWidth = 0.5;
            for (let i = 0; i < len; i++) {
                const a = particles[i];
                for (let j = i + 1; j < len; j++) {
                    const b = particles[j];
                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < CONNECTION_DIST_SQ) {
                        const opacity = (1 - distSq / CONNECTION_DIST_SQ) * 0.12;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.stroke();
                    }
                }
            }

            // Draw mouse connections
            if (mouse.x !== null) {
                for (let i = 0; i < len; i++) {
                    const p = particles[i];
                    const dx = p.x - mouse.x;
                    const dy = p.y - mouse.y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < MOUSE_RADIUS_SQ) {
                        const opacity = (1 - distSq / MOUSE_RADIUS_SQ) * 0.3;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }
            }

            // Draw particles
            for (let i = 0; i < len; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${p.o})`;
                ctx.fill();
            }

            animId = requestAnimationFrame(animate);
        }

        // Subtle parallax on title
        function updateTitleParallax(x, y) {
            const cx = width / 2;
            const cy = height / 2;
            const ox = ((x - cx) / cx) * -6;
            const oy = ((y - cy) / cy) * -4;
            title.style.transform = `translate(${ox}px, ${oy}px)`;
        }

        function resetTitleParallax() {
            title.style.transform = 'none';
        }

        // Events
        window.addEventListener('resize', () => {
            resize();
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            updateTitleParallax(e.clientX, e.clientY);
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
            resetTitleParallax();
        });

        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            mouse.x = t.clientX;
            mouse.y = t.clientY;
        }, { passive: true });

        window.addEventListener('touchend', () => {
            mouse.x = null;
            mouse.y = null;
        });

        init();
        animate();

    </script>
</body>
</html>
